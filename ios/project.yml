# XcodeGen spec for the iOS app.
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# The generated KeySupportValidator.xcodeproj is committed too, so you can just
# open it. Regenerate whenever files are added or build settings change, rather
# than editing the pbxproj by hand.
#
# DEVELOPMENT_TEAM is deliberately unset. Set it in Xcode under Signing &
# Capabilities, or pass DEVELOPMENT_TEAM=XXXXXXXXXX to xcodebuild. Building for a
# device also needs the "Near Field Communication Tag Reading" capability, which
# requires a paid Apple Developer Program membership — a free personal team
# cannot provision the NFC entitlement.

name: KeySupportValidator

options:
  bundleIdPrefix: net.keysupport
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

targets:
  KeySupportValidator:
    type: application
    platform: iOS

    sources:
      - path: KeySupportValidator/App
      - path: KeySupportValidator/PIV
      - path: KeySupportValidator/Network

    settings:
      base:
        PRODUCT_NAME: KeySupportValidator
        PRODUCT_BUNDLE_IDENTIFIER: net.keysupport.cardread
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: KeySupportValidator/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeySupportValidator/Resources/KeySupportValidator.entitlements

        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"     # iPhone only; iPads have no NFC reader
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: complete
